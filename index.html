<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 찾는 내 운명 포켓몬</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #f7f4eb; /* 깔끔하고 심플한 크림 톤 배경 */
      color: #382e25;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 비눗방울 캔버스 (배경 전체) */
    #bubble-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* 메인 카드 컨테이너 */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #eae2d0;
      border-radius: 24px;
      padding: 32px 22px;
      box-shadow: 0 12px 32px rgba(90, 75, 60, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      color: #e2820a;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 0.98rem;
      color: #7c6f62;
      margin-bottom: 24px;
    }

    /* MBTI 선택 그리드 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 420px) {
      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .mbti-btn {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #4a3c30;
      background: #ffffff;
      border: 2px solid #ebdcc4;
      border-radius: 14px;
      padding: 14px 0;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .mbti-btn:hover {
      border-color: #e2820a;
      background: #fff8eb;
      color: #e2820a;
      transform: translateY(-2px);
    }

    .mbti-btn:active {
      transform: translateY(0);
    }

    /* 결과창 디자인 */
    #result-view {
      display: none;
      animation: fadeIn 0.35s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 포켓몬 사진 카드 프레임 */
    .photo-card {
      background: #ffffff;
      border: 3px solid #f2e3c6;
      border-radius: 20px;
      padding: 20px;
      margin: 16px 0 20px 0;
      box-shadow: 0 8px 20px rgba(226, 130, 10, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .type-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: #fff0d6;
      color: #d97706;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .pokemon-img-frame {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fffbf2 0%, #fef3d6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.8rem;
      margin: 10px 0 12px 0;
      border: 3px solid #fde68a;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }

    .pokemon-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #d97706;
      margin-bottom: 4px;
    }

    /* 설명 카드 블록 */
    .info-box {
      background: #fdfaf3;
      border: 1px solid #f0e4cf;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-align: left;
    }

    .info-box h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #b45309;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-box p {
      font-size: 0.93rem;
      line-height: 1.6;
      color: #524538;
      word-break: keep-all;
    }

    /* 궁합 카드 컨테이너 (2열) */
    .match-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    @media (max-width: 480px) {
      .match-container {
        grid-template-columns: 1fr;
      }
    }

    .match-card {
      border-radius: 14px;
      padding: 14px;
      text-align: left;
    }

    .match-card.best {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
    }

    .match-card.worst {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .match-title {
      font-size: 0.88rem;
      font-weight: 800;
    }

    .match-card.best .match-title { color: #15803d; }
    .match-card.worst .match-title { color: #b91c1c; }

    .match-badge {
      font-size: 0.9rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 10px;
    }

    .match-card.best .match-badge { background: #dcfce7; color: #166534; }
    .match-card.worst .match-badge { background: #fee2e2; color: #991b1b; }

    .match-desc {
      font-size: 0.85rem;
      line-height: 1.45;
      color: #4b5563;
      word-break: keep-all;
    }

    /* 다시 고르기 버튼 */
    .reset-btn {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      background: #e2820a;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      margin-top: 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .reset-btn:hover {
      background: #c76f03;
    }
  </style>
</head>
<body>

  <!-- 배경 비눗방울 애니메이션 캔버스 -->
  <canvas id="bubble-canvas"></canvas>

  <div class="app-container">
    <div id="header-area">
      <h1>🐣 MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">내 MBTI를 선택하고 어울리는 포켓몬을 확인하세요!</p>
    </div>

    <!-- MBTI 버튼 목록 -->
    <div class="mbti-grid" id="mbti-grid"></div>

    <!-- 결과 영역 -->
    <div id="result-view">
      <!-- 사진 프레임 -->
      <div class="photo-card">
        <span class="type-badge" id="res-mbti-badge">ENFP</span>
        <div class="pokemon-img-frame" id="res-emoji">⚡</div>
        <div class="pokemon-name" id="res-poke-name">피카츄</div>
      </div>

      <!-- MBTI 특징 설명 -->
      <div class="info-box">
        <h3>🧠 MBTI 성격 특징</h3>
        <p id="res-mbti-desc">MBTI 성격 설명이 들어갑니다.</p>
      </div>

      <!-- 포켓몬 매칭 이유 -->
      <div class="info-box">
        <h3>❤️ 포켓몬과 닮은 이유</h3>
        <p id="res-poke-desc">포켓몬과 어울리는 이유 설명이 들어갑니다.</p>
      </div>

      <!-- 궁합 정보 (최고 vs 최악) -->
      <div class="match-container">
        <!-- 가장 잘 맞는 궁합 -->
        <div class="match-card best">
          <div class="match-header">
            <span class="match-title">💚 최고의 궁합</span>
            <span class="match-badge" id="res-best-mbti">INFJ</span>
          </div>
          <div class="match-desc" id="res-best-desc">잘 맞는 이유 설명</div>
        </div>

        <!-- 가장 안 맞는 궁합 -->
        <div class="match-card worst">
          <div class="match-header">
            <span class="match-title">💔 상극 궁합</span>
            <span class="match-badge" id="res-worst-mbti">ISTJ</span>
          </div>
          <div class="match-desc" id="res-worst-desc">안 맞는 이유 설명</div>
        </div>
      </div>

      <button class="reset-btn" onclick="resetUI()">🔄 다시 고르기</button>
    </div>
  </div>

      name: "밀탱크",
      emoji: "🐄",
      mbtiDesc: "성실하고 묵묵하며 주변 사람들을 위해 자신을 기꺼이 헌신하는 든든한 수호자입니다.",
      pokeDesc: "풍부한 우유와 포근한 품으로 동료들에게 안식처가 되어주는 밀탱크처럼 신뢰감을 줍니다.",
      best: { mbti: "ESTP", reason: "단조로울 수 있는 일상에 생동감과 새로운 즐거움을 불어넣어 줍니다." },
      worst: { mbti: "ENTP", reason: "규칙을 끊임없이 흔들고 불확실한 상황을 만들 때 불안해합니다." }
    },
    ISTP: {
      name: "팬텀",
      emoji: "👻",
      mbtiDesc: "상황 판단력이 뛰어나고 도구를 유연하게 다루는 냉철한 문제해결사입니다.",
      pokeDesc: "그림자 속에서 상황을 관조하다 기지를 발휘하는 팬텀처럼 쿨하면서도 확실한 해결책을 제시합니다.",
      best: { mbti: "ESFJ", reason: "정반대의 성향이지만 서로의 부족한 점을 가장 완벽하게 완충해 줍니다." },
      worst: { mbti: "ENFJ", reason: "과도하게 감정적인 동의를 요구하거나 간섭받는 느낌을 싫어합니다." }
    },
    ISTJ: {
      name: "거북왕",
      emoji: "🐢",
      mbtiDesc: "신중하고 원칙에 충실하며, 맡은 임무는 끝까지 완수해 내는 현실주의자입니다.",
      pokeDesc: "단단한 등껍질과 막강한 물대포로 자리를 지키는 거북왕처럼 철두철미한 방어막이 되어줍니다.",
      best: { mbti: "ESFP", reason: "딱딱하게 경직된 일상에 밝은 웃음과 유쾌한 여유를 선사해 줍니다." },
      worst: { mbti: "ENFP", reason: "예측 불가능하고 무책임하게 계획을 바꿀 때 스트레스를 받습니다." }
    }
  };

  // MBTI 그리드 버튼 생성
  const mbtiGrid = document.getElementById("mbti-grid");
  Object.keys(MBTI_POKEMON).forEach(type => {
    const btn = document.createElement("button");
    btn.className = "mbti-btn";
    btn.innerText = type;
    btn.onclick = () => showResult(type);
    mbtiGrid.appendChild(btn);
  });

  // 결과 화면 출력
  function showResult(type) {
    const data = MBTI_POKEMON[type];

    document.getElementById("res-mbti-badge").innerText = type;
    document.getElementById("res-emoji").innerText = data.emoji;
    document.getElementById("res-poke-name").innerText = data.name;
    document.getElementById("res-mbti-desc").innerText = data.mbtiDesc;
    document.getElementById("res-poke-desc").innerText = data.pokeDesc;

    document.getElementById("res-best-mbti").innerText = data.best.mbti;
    document.getElementById("res-best-desc").innerText = data.best.reason;

    document.getElementById("res-worst-mbti").innerText = data.worst.mbti;
    document.getElementById("res-worst-desc").innerText = data.worst.reason;

    document.getElementById("header-area").style.display = "none";
    document.getElementById("mbti-grid").style.display = "none";
    document.getElementById("result-view").style.display = "block";

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 다시 고르기
  function resetUI() {
    document.getElementById("result-view").style.display = "none";
    document.getElementById("header-area").style.display = "block";
    document.getElementById("mbti-grid").style.display = "grid";
  }

  /* ----------------------------------------------------
   * 배경 둥둥 떠다니는 비눗방울 애니메이션 (Canvas)
   * ---------------------------------------------------- */
  const canvas = document.getElementById('bubble-canvas');
  const ctx = canvas.getContext('2d');

  let bubbles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 비눗방울 객체 생성을 위한 클래스
  class Bubble {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + Math.random() * 100;
      this.radius = Math.random() * 18 + 8; // 크기
      this.speed = Math.random() * 0.8 + 0.3; // 오르는 속도
      this.swing = Math.random() * 0.03 + 0.01; // 좌우 흔들림
      this.angle = Math.random() * Math.PI * 2;
      this.opacity = Math.random() * 0.4 + 0.2;
    }

    update() {
      this.y -= this.speed;
      this.angle += this.swing;
      this.x += Math.sin(this.angle) * 0.6;

      // 화면 위로 나가면 아래에서 다시 생성
      if (this.y < -this.radius * 2) {
        this.reset();
      }
    }

    draw() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

      // 은은하고 심플한 비눗방울 빛 반사 그라데이션
      const gradient = ctx.createRadialGradient(
        this.x - this.radius * 0.3,
        this.y - this.radius * 0.3,
        this.radius * 0.1,
        this.x,
        this.y,
        this.radius
      );
      gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity + 0.3})`);
      gradient.addColorStop(0.7, `rgba(255, 235, 205, ${this.opacity * 0.5})`);
      gradient.addColorStop(1, `rgba(226, 130, 10, ${this.opacity * 0.2})`);

      ctx.fillStyle = gradient;
      ctx.fill();

      // 테두리 반짝임
      ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }
  }

  // 초기 비눗방울 25개 생성
  for (let i = 0; i < 25; i++) {
    const b = new Bubble();
    b.y = Math.random() * canvas.height; // 화면 전체에 고르게 배치
    bubbles.push(b);
  }

  function animateBubbles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(b => {
      b.update();
      b.draw();
    });
    requestAnimationFrame(animateBubbles);
  }

  animateBubbles();
</script>
</body>
</html>
