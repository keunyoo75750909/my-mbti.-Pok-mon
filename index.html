  // 오프라인 Web Audio API 사운드 효과
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playPopSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playFanfareSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + idx * 0.09;
      gain.gain.setValueAtTime(0.25, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.25);
    });
  }

      match: "ESFP",

  // UI 초기화 및 MBTI 버튼 생성
  const gridEl = document.getElementById("mbti-grid");
  const headerBox = document.getElementById("header-box");
  const resultBox = document.getElementById("result-box");

  Object.keys(MBTI_DATA).forEach(type => {
    const btn = document.createElement("button");
    btn.className = "mbti-card";
    btn.onclick = () => selectMBTI(type);
    btn.innerHTML = `
      <div>${type}</div>
      <span class="group-tag">${MBTI_DATA[type].tag}</span>
    `;
    gridEl.appendChild(btn);
  });

  // MBTI 선택 함수
  function selectMBTI(type) {
    playPopSound();
    setTimeout(playFanfareSound, 150);
    triggerConfetti();

    const item = MBTI_DATA[type];

    document.getElementById("res-mbti-tag").innerText = `${type} • ${item.tag}`;
    document.getElementById("res-emoji").innerText = item.emoji;
    document.getElementById("res-name").innerText = item.name;
    document.getElementById("res-mbti-title").innerText = `${type} 성격 리포트`;
    document.getElementById("res-mbti-desc").innerText = item.mbtiDesc;
    document.getElementById("res-poke-title").innerText = `${item.name}와(과) 닮은 점`;
    document.getElementById("res-poke-desc").innerText = item.pokeDesc;
    document.getElementById("res-match-type").innerText = item.match;
    document.getElementById("res-match-reason").innerText = item.matchReason;

    gridEl.style.display = "none";
    headerBox.style.display = "none";
    resultBox.style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 다시 선택하기
  function resetApp() {
    playPopSound();
    resultBox.style.display = "none";
    gridEl.style.display = "grid";
    headerBox.style.display = "block";
  }

  // 순수 자바스크립트 팡파르 폭죽 효과 (Canvas Confetti)
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerConfetti() {
    particles = [];
    const colors = ['#ff7675', '#fdcb6e', '#ffeaa7', '#55efc4', '#74b9ff', '#a29bfe'];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 18,
        vy: (Math.random() - 0.7) * 18,
        size: Math.random() * 9 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 10,
        opacity: 1
      });
    }
    requestAnimationFrame(renderConfetti);
  }

  function renderConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;

    particles.forEach(p => {
      if (p.opacity > 0) {
        active = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // 중력
        p.opacity -= 0.015;
        p.rotation += p.rSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    });

    if (active) requestAnimationFrame(renderConfetti);
  }
</script>
